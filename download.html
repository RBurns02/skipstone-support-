<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get Skipstone</title>
<meta name="description" content="Skipstone — skip a stone across the lake. Free on the App Store.">

<!-- Open Graph, so the link shows a card instead of bare text when it is
     pasted into Instagram, Messages, Discord or anywhere else. -->
<meta property="og:title" content="Skipstone">
<meta property="og:description" content="Chase the perfect throw. Free on the App Store.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://rburns02.github.io/skipstone-support-/download.html">

<style>
  :root { color-scheme: dark; --bg:#0b1020; --card:#131a30; --ink:#e8eefc; --dim:#9fb0d0; --line:#24304f; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); min-height:100vh;
         display:flex; align-items:center; justify-content:center; padding:2rem 1.25rem;
         font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  main { max-width:32rem; width:100%; text-align:center; }
  h1 { font-size:2.25rem; margin:0 0 .3rem; letter-spacing:-.02em; }
  p.sub { color:var(--dim); margin:0 0 2rem; }
  .store { display:flex; align-items:center; justify-content:center; gap:.7rem;
           background:#e8eefc; color:#0b1020; border-radius:14px; padding:1rem 1.5rem;
           text-decoration:none; font-weight:600; font-size:1.05rem; }
  .store:hover { background:#fff; }
  .store svg { width:1.4rem; height:1.4rem; flex:none; }
  .soon { display:block; margin-top:.75rem; background:var(--card); border:1px solid var(--line);
          border-radius:14px; padding:1rem 1.25rem; color:var(--dim); font-size:.95rem; }
  .links { display:grid; gap:.6rem; margin-top:2.25rem; }
  a.card { display:block; background:var(--card); border:1px solid var(--line); border-radius:12px;
           padding:.8rem 1.1rem; color:var(--dim); text-decoration:none; text-align:left; font-size:.9rem; }
  a.card:hover { border-color:#3c5080; color:var(--ink); }
  footer { color:var(--dim); font-size:.85rem; margin-top:2rem; }
  .notset { background:#3a1f1f; border:1px solid #7a3a3a; color:#ffd9d9; border-radius:12px;
            padding:.9rem 1.1rem; font-size:.9rem; text-align:left; margin-bottom:1rem; }
</style>
</head>
<body>
<main>
  <h1>Skipstone</h1>
  <p class="sub">Chase the perfect throw.</p>

  <div id="cta"></div>
  <span class="soon">Android — coming soon</span>

  <div class="links">
    <a class="card" href="support.html">Support</a>
    <a class="card" href="privacy.html">Privacy Policy</a>
    <a class="card" href="terms.html">Terms of Service</a>
  </div>
  <footer>robbiemmiller12345@gmail.com</footer>
</main>

<script>
// ---------------------------------------------------------------------------
// THE ONLY LINE TO EDIT. Your app's numeric App Store ID.
// App Store Connect -> Skipstone -> App Information -> Apple ID (10 digits).
// 6812950489 is Skipstone ("Skipstone: Stone Skipping", com.rburns.skip),
// confirmed with Apple's lookup API. It was 6775250750 until 24 September,
// which is The Preacher: this page sent every visitor to the wrong app.
const APP_ID = '6812950489';
// ---------------------------------------------------------------------------

// Where the visitor came from, so installs can be told apart in App Store
// Connect -> App Analytics -> Acquisition, broken out by Campaign. Share
// download.html?s=ig on Instagram, ?s=tiktok on TikTok, and so on; a bare link
// counts as "site". No tracking of the person, just a label on the click --
// Apple counts it, we never see it.
const src = (new URLSearchParams(location.search).get('s') || 'site')
  .replace(/[^a-z0-9_-]/gi, '').slice(0, 40) || 'site';

const APPLE = '<svg viewBox="0 0 384 512" fill="currentColor" aria-hidden="true"><path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/></svg>';

const cta = document.getElementById('cta');
if (APP_ID) {
  const a = document.createElement('a');
  a.className = 'store';
  a.href = 'https://apps.apple.com/app/id' + APP_ID + '?ct=' + encodeURIComponent(src);
  a.innerHTML = APPLE + '<span>Download on the App&nbsp;Store</span>';
  cta.appendChild(a);
} else {
  // Better a visible note than a button that goes nowhere.
  cta.innerHTML = '<div class="notset"><strong>Not finished yet.</strong><br>'
    + 'Set <code>APP_ID</code> near the bottom of <code>download.html</code> to the '
    + '10-digit Apple ID from App Store Connect &rarr; App Information.</div>';
}
</script>
</body>
</html>
